name: GTA 6 Auto Clipper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-clipper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Auto Clipper Script
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          LIVE_STREAM_URL: ${{ secrets.LIVE_STREAM_URL }}
        run: |
          python auto_clipper.py
          
